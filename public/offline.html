<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>HN-AI — Offline</title>
<style>
  html,body{margin:0;height:100%;background:#0b0a1f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
  .wrap{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center}
  .card{max-width:420px;padding:32px;border-radius:24px;background:linear-gradient(180deg,rgba(124,77,255,.12),rgba(0,229,255,.06));border:1px solid rgba(124,77,255,.35);box-shadow:0 20px 60px rgba(0,0,0,.5)}
  h1{font-size:28px;margin:8px 0 6px;background:linear-gradient(90deg,#FFD86B,#FFA940,#FFD86B);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:#b9b7d1;font-size:14px;line-height:1.6}
  a{display:inline-block;margin-top:16px;padding:10px 18px;border-radius:999px;background:linear-gradient(90deg,#7c4dff,#00e5ff);color:#0b0a1f;font-weight:700;text-decoration:none}
</style>
</head>
<body>
  <div class="wrap"><div class="card">
    <div style="font-size:48px">👑</div>
    <h1>You're offline</h1>
    <p>HN-AI couldn't reach the network. Some saved lessons may still work — reconnect to sync your daily mission.</p>
    <a href="/">Try again</a>
  </div></div>
</body>
</html>
